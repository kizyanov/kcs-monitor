name: Rust CI/CD with GHCR

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/kcs-monitor

# Отменяем устаревшие запуски при новых пушах в тот же ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Качество кода: fmt, clippy, тесты — на push и PR
  test:
    name: Format, Clippy and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Lint
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Test
      run: cargo test --all-features

  # Проверка, что Dockerfile собирается, — на каждом PR (без публикации)
  build-image:
    name: Build Docker image (PR check)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: false
        load: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke test image
      run: |
        timeout 20 docker run --rm "$IMAGE_ID" || test $? -eq 124
      env:
        IMAGE_ID: ${{ steps.build.outputs.imageid }}

  # Сборка и публикация в GHCR — только на push (main и теги v*) или вручную
  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          type=sha,prefix=,suffix=
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        load: true # грузим в локальный демон, чтобы прогнать smoke-тест
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke test image
      run: |
        timeout 20 docker run --rm "$IMAGE_ID" || test $? -eq 124
      env:
        IMAGE_ID: ${{ steps.build.outputs.imageid }}

    - name: Print image info
      run: |
        echo "Image built and pushed to GHCR:"
        echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
        echo "Tags: ${{ steps.meta.outputs.tags }}"
